name: infraestructura-mtc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infraestructura_mtc
      POSTGRES_PASSWORD: infraestructura_mtc
      POSTGRES_DB: infraestructura_mtc
    ports:
      - "127.0.0.1:5457:5432"
    volumes:
      - infraestructura_mtc_pgdata:/var/lib/postgresql/data

volumes:
  infraestructura_mtc_pgdata:

networks:
  default:
    name: appsperu_shared
    external: true
