# Config de Cloudflare Pages para rastro-web. Usada para `wrangler pages dev`
# / deploy manual desde apps/rastro-web/ — Y TAMBIÉN por el deploy real vía
# Git: Cloudflare resuelve el wrangler.toml más cercano al build output
# directory (apps/rastro-web/dist), no el de la raíz del repo, pase lo que
# diga cualquier comentario viejo por acá abajo (confirmado con el incidente
# de ACCESS_REQUESTS del 2026-09-22 — ver ese bloque más abajo). Cualquier
# `[[kv_namespaces]]` que se agregue acá AFECTA producción — si ese mismo
# binding ya existe en el dashboard (Settings → Functions → KV namespace
# bindings), el publish de TODAS las Functions falla.
#   - `wrangler pages dev dist`  → simular el entorno Pages en local
#   - `wrangler pages deploy dist --project-name=rastro` → deploy manual
#
# URL pública: https://rastro.fyi/ (fallback: https://rastro-5zm.pages.dev/)

name = "rastro"
compatibility_date = "2025-09-01"
pages_build_output_dir = "./dist"

# AL3-17/AL3-11 — KV usado por functions/api/search.ts y
# functions/api/rate-limit-stats.ts (rate limit por IP + contador de 429).
# El namespace se crea una sola vez con:
#   npx wrangler kv namespace create RATE_LIMIT
# y el `id` que devuelva reemplaza el placeholder de abajo. Ver
# apps/rastro-web/DEPLOY.md §5 para el paso a paso completo, incluido el
# binding en el dashboard de Pages (Settings → Functions → KV namespace
# bindings) que además del wrangler.toml requiere Cloudflare Pages Git deploy.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "da7766279cc54ba5817e338b76eb3ef1"

# functions/api/solicitud-acceso.ts (formulario /solicitar-acceso) — guarda
# cada solicitud de sk-rastro-* para revisión manual (nombre, correo,
# teléfono, motivo). Retención: 90 días (expirationTtl en
# functions/api/solicitud-acceso.ts) — no persiste PII indefinidamente.
#
# NO declarado acá a propósito (2026-09-22, incidente real): este archivo SÍ
# lo lee el deploy real vía Git — contra lo que decía el comentario de
# cabecera de más arriba — porque Cloudflare Pages resuelve el wrangler.toml
# más cercano al build output directory (apps/rastro-web/dist), no el de la
# raíz del repo. Declarar ACCESS_REQUESTS acá Y en el dashboard (Settings →
# Functions → KV namespace bindings, donde ya vive) rompió el publish de
# TODAS las Functions con "Binding name 'ACCESS_REQUESTS' already in use" —
# tumbó /api/search también, no solo este endpoint. El namespace real es
# 139c606fcfb94b71a31606228224ff01; queda solo en el dashboard.

# Las 3 VITE_API_BASE_URL_* de producción viven en `[vars]` del wrangler.toml
# de la RAÍZ del repo, no acá — a diferencia de los `[[kv_namespaces]]` de
# arriba, que si aplican desde este archivo (ver comentario de cabecera). No
# se han visto duplicados entre ambos wrangler.toml para estas 3 vars, pero
# no está confirmado con la misma certeza que el caso de KV — si algún día
# una de ellas también rompe el build con "already in use" o similar, es la
# misma causa. Localmente, `wrangler pages dev` sin `.dev.vars` configurado
# no golpea accidentalmente las APIs en vivo — usa `.dev.vars.example` como
# base para tu `.dev.vars`.
#
# CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — Cloudflare Access Service
# Token (secreto, NO va en ningún wrangler.toml). Se configura en el
# dashboard de Cloudflare Pages → Settings → Variables and secrets → tipo
# Secret. La Function /api/search los envía como headers
# `CF-Access-Client-Id` / `CF-Access-Client-Secret` a las APIs en vivo
# (api.rastro.fyi). Sin esos tokens, Cloudflare Access bloquea la request
# con 403/302. Ver docs/API_ACCESS_PROTECTION.md.

# Headers HTTP personalizados (Cache-Control, Security, etc.)
# Aplican a todo el sitio. Se pueden sobreescribir por ruta si se necesita.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Cache corta por defecto; assets versionados tienen cache largo.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite genera assets con hash → cachear 1 año.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.txt"
  [headers.values]
    # robots.txt y llms.txt se sirven siempre frescos.
    Cache-Control = "public, max-age=300"

# SPA fallback: todas las rutas devuelven index.html (necesario para
# React Router). Ya está implícito en Pages para archivos estáticos,
# pero lo declaramos explícito por claridad.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

