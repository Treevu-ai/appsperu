# Configuración local / deploy manual con wrangler CLI desde apps/rastro-web/.
# Para Cloudflare Workers Builds (Git deploy desde la raíz del monorepo),
# usa el wrangler.toml de la raíz del repo + scripts/cloudflare-rastro-deploy.sh.
#
# Deploys via Git (Pages clásico) usan public/_redirects y public/_headers.
#   - `wrangler pages dev dist`  → simular el entorno Pages en local
#   - `wrangler pages deploy dist --project-name=rastro` → deploy manual
#
# URL pública: https://rastro.fyi/ (fallback: https://rastro-5zm.pages.dev/)

name = "rastro"
compatibility_date = "2025-09-01"
pages_build_output_dir = "./dist"

# AL3-17/AL3-11 — KV usado por functions/api/search.ts y
# functions/api/rate-limit-stats.ts (rate limit por IP + contador de 429).
# El namespace se crea una sola vez con:
#   npx wrangler kv namespace create RATE_LIMIT
# y el `id` que devuelva reemplaza el placeholder de abajo. Ver
# apps/rastro-web/DEPLOY.md §5 para el paso a paso completo, incluido el
# binding en el dashboard de Pages (Settings → Functions → KV namespace
# bindings) que además del wrangler.toml requiere Cloudflare Pages Git deploy.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "da7766279cc54ba5817e338b76eb3ef1"

# Este archivo es solo para `wrangler pages dev` / deploy manual desde
# apps/rastro-web/ (ver comentario de cabecera). El deploy real vía Git
# (Cloudflare Workers Builds) lee el wrangler.toml de la raíz del repo —
# ahí viven las 3 VITE_API_BASE_URL_* de producción, NO acá, para que
# `wrangler pages dev` sin `.dev.vars` configurado no golpee accidentalmente
# las APIs en vivo — usa `.dev.vars.example` como base para tu `.dev.vars`.
#
# CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — Cloudflare Access Service
# Token (secreto, NO va en ningún wrangler.toml). Se configura en el
# dashboard de Cloudflare Pages → Settings → Variables and secrets → tipo
# Secret. La Function /api/search los envía como headers
# `CF-Access-Client-Id` / `CF-Access-Client-Secret` a las APIs en vivo
# (api.rastro.fyi). Sin esos tokens, Cloudflare Access bloquea la request
# con 403/302. Ver docs/API_ACCESS_PROTECTION.md.

# Headers HTTP personalizados (Cache-Control, Security, etc.)
# Aplican a todo el sitio. Se pueden sobreescribir por ruta si se necesita.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Cache corta por defecto; assets versionados tienen cache largo.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite genera assets con hash → cachear 1 año.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.txt"
  [headers.values]
    # robots.txt y llms.txt se sirven siempre frescos.
    Cache-Control = "public, max-age=300"

# SPA fallback: todas las rutas devuelven index.html (necesario para
# React Router). Ya está implícito en Pages para archivos estáticos,
# pero lo declaramos explícito por claridad.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

