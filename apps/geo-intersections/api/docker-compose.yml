name: geo-intersections

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geo_int
      POSTGRES_PASSWORD: geo_int
      POSTGRES_DB: geo_intersections
    ports:
      - "127.0.0.1:5466:5432"
    volumes:
      - geo_int_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_int -d geo_intersections"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  geo_int_pgdata:

networks:
  default:
    name: appsperu_shared
    external: true
