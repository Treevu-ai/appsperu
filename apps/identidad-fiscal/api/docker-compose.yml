name: identidad-fiscal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: fiscal
      POSTGRES_DB: identidad_fiscal
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - fiscal_pgdata:/var/lib/postgresql/data

volumes:
  fiscal_pgdata:
