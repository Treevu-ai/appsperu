# Proxy path-based para las 14 APIs de Rastro en api.rastro.pe
# Instalar: bash scripts/setup-api-rastro-pe.sh (desde el VPS)
#
# Cada location /{slug}/ → http://127.0.0.1:{port}/
# Ejemplo: GET /radar-ejecucion/health → localhost:4000/health

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name api.rastro.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rastro.pe;

    # Certbot rellena estas rutas en el primer deploy
    ssl_certificate     /etc/letsencrypt/live/api.rastro.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rastro.pe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Health agregado (opcional)
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"api.rastro.pe","apps":14}\n';
    }

    location /radar-ejecucion/ {
        proxy_pass http://127.0.0.1:4000/;
        include /etc/nginx/snippets/rastro-proxy-params.conf;
    }
    location = /radar-ejecucion {
        return 301 /radar-ejecucion/;
    }

    location /compras-publicas/ {
        proxy_pass http://127.0.0.1:4001/;
        include /etc/nginx/snippets/rastro-proxy-params.conf;
    }
    location = /compras-publicas {
        return 301 /compras-publicas/;
    }

    location /radar-inversiones/ {
        proxy_pass http://127.0.0.1:4002/;
        include /etc/nginx/snippets/rastro-proxy-params.conf;
