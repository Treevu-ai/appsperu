# rastro-api-gateway — api.rastro.pe (path router → 14 apps .internal)
app = "rastro-api-gateway"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PRIMARY_REGION = "gru"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
