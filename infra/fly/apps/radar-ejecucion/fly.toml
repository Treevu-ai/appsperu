# Generado por scripts/fly-generate-configs.sh (prefix: treevu-rastro)
# Deploy SIEMPRE desde la raíz: fly deploy . --config infra/fly/apps/radar-ejecucion/fly.toml --dockerfile infra/fly/Dockerfile.api
app = "treevu-rastro-radar-ejecucion"
primary_region = "gru"

[build]
  [build.args]
    APP_DIR = "radar-ejecucion"

[env]
  PORT = "8080"
  WEB_ORIGIN = "https://www.rastro.fyi,https://rastro.fyi,https://rastro-5zm.pages.dev"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
