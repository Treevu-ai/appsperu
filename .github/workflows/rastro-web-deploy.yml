name: Rastro Web Deploy

# Tres triggers:
#   1. push a master (solo si cambia apps/rastro-web/** o este workflow)
#   2. workflow_dispatch (botón "Run workflow" en GitHub Actions — para forzar redeploy)
#   3. schedule semanal (miércoles 12:00 UTC = 07:00 hora Perú)
#
# Deploy a Cloudflare Pages (en orden de preferencia):
#   A) `wrangler pages deploy` con CLOUDFLARE_API_TOKEN — sube el dist que pasó CI.
#   B) Deploy Hook (CLOUDFLARE_DEPLOY_HOOK_URL) — pide a Cloudflare que rebuildee desde Git.
#   C) Push a master — la GitHub App de Cloudflare Pages rebuildea sola (si está conectada).
#
# El CI completo (typecheck + lint:meta + test + build + e2e) corre ANTES del
# deploy — si la suite E2E (Playwright, "JSON de API = JSON renderizado")
# falla, el job entero falla y ningún paso de deploy se ejecuta. Cierra
# AL3-18 ("Build pipeline corre tests E2E antes de promover a producción").

on:
  push:
    branches: [master]
    paths:
      - "apps/rastro-web/**"
      - ".github/workflows/rastro-web-deploy.yml"
  workflow_dispatch:
  schedule:
    # Miércoles 12:00 UTC = 07:00 hora Perú. Refresca el build para arrastrar
    # cambios en los datos de las 14 APIs (ingestas diarias/semanales).
    - cron: "0 12 * * 3"

permissions:
  contents: read

concurrency:
  group: rastro-web-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: CI + deploy Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rastro-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/rastro-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint meta
        run: npm run lint:meta

      - name: Unit tests
        run: npm test
        env:
          VITE_API_BASE_URL_RADAR_EJECUCION: http://localhost:4000
          VITE_API_BASE_URL_COMPRAS_PUBLICAS: http://localhost:4001
          VITE_API_BASE_URL_RADAR_INVERSIONES: http://localhost:4002
          VITE_API_BASE_URL_INFOBRAS: http://localhost:4003
          VITE_API_BASE_URL_CEPLAN_ESTRATEGICO: http://localhost:4004
          VITE_API_BASE_URL_CEPLAN_GEO: http://localhost:4005
          VITE_API_BASE_URL_IDENTIDAD_FISCAL: http://localhost:4006
          VITE_API_BASE_URL_SALUD_INSTITUCIONAL: http://localhost:4007
          VITE_API_BASE_URL_PROVEEDORES_SANCIONADOS: http://localhost:4008
          VITE_API_BASE_URL_ACTIVIDAD_AGRARIA: http://localhost:4009
          VITE_API_BASE_URL_SEGURIDAD_CIUDADANA: http://localhost:4010
          VITE_API_BASE_URL_BCRP_COMERCIO_EXTERIOR: http://localhost:4011
          VITE_API_BASE_URL_INVERSION_PRIVADA: http://localhost:4012
          VITE_API_BASE_URL_BCRP_LA_LIBERTAD: http://localhost:4013

      - name: Install Playwright browser (Chromium only)
        run: npm run e2e:install

      - name: E2E suite (gate antes de deploy)
        # Corre ANTES del build de producción a propósito: el webServer de
        # playwright.config.ts hace su propio `npm run build && npm run
        # preview` con las URLs falsas de abajo — si esto corriera después
        # del "Build" de más abajo, pisaría el dist/ real (con
        # .env.production) justo antes del deploy.
        run: npm run e2e
        env:
          # Path-based, un solo host — igual que .env.production
          # (https://api.rastro.pe/<app>) y que los page.route("**/<app>/api/...")
          # de e2e/*.spec.ts. Un host por app rompe el match del glob y hace
          # que el fetch real salga a un DNS inexistente (bug real, encontrado
          # y corregido 2026-09-02 en rastro-web-ci.yml — ver ese archivo).
          VITE_API_BASE_URL_RADAR_EJECUCION: https://api.example.test/radar-ejecucion
          VITE_API_BASE_URL_COMPRAS_PUBLICAS: https://api.example.test/compras-publicas
          VITE_API_BASE_URL_RADAR_INVERSIONES: https://api.example.test/radar-inversiones
          VITE_API_BASE_URL_INFOBRAS: https://api.example.test/infobras
          VITE_API_BASE_URL_CEPLAN_ESTRATEGICO: https://api.example.test/ceplan-estrategico
          VITE_API_BASE_URL_CEPLAN_GEO: https://api.example.test/ceplan-geo
          VITE_API_BASE_URL_IDENTIDAD_FISCAL: https://api.example.test/identidad-fiscal
          VITE_API_BASE_URL_SALUD_INSTITUCIONAL: https://api.example.test/salud-institucional
          VITE_API_BASE_URL_PROVEEDORES_SANCIONADOS: https://api.example.test/proveedores-sancionados
          VITE_API_BASE_URL_ACTIVIDAD_AGRARIA: https://api.example.test/actividad-agraria
          VITE_API_BASE_URL_SEGURIDAD_CIUDADANA: https://api.example.test/seguridad-ciudadana
          VITE_API_BASE_URL_BCRP_COMERCIO_EXTERIOR: https://api.example.test/bcrp-comercio-exterior
          VITE_API_BASE_URL_INVERSION_PRIVADA: https://api.example.test/inversion-privada
          VITE_API_BASE_URL_BCRP_LA_LIBERTAD: https://api.example.test/bcrp-la-libertad

      - name: Build
        run: npm run build
        # URLs públicas vienen de apps/rastro-web/.env.production (api.rastro.pe).
        # Corre DESPUÉS del gate de E2E a propósito — ver comentario arriba.
        # Este es el dist/ real que sube el paso de deploy.

      - name: Verificar artefactos de Pages (_redirects, _headers)
        run: |
          test -f dist/_redirects || (echo "::error::Falta dist/_redirects (SPA fallback)" && exit 1)
          test -f dist/_headers || (echo "::error::Falta dist/_headers" && exit 1)

      - name: Resumen del build
        run: |
          echo "## Build resumen" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tamaño JS: $(du -h dist/assets/index-*.js | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- Tamaño CSS: $(du -h dist/assets/index-*.css | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy a Cloudflare Pages (wrangler)
        id: wrangler-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "wrangler_skipped=true" >> "$GITHUB_OUTPUT"
            echo "Sin CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID — se omite wrangler deploy."
            exit 0
          fi
          echo "wrangler_skipped=false" >> "$GITHUB_OUTPUT"
          npx wrangler pages deploy dist \
            --project-name=rastro \
            --branch="${GITHUB_REF_NAME}" \
            --commit-dirty=true
          echo "- Deploy vía wrangler → proyecto \`rastro\` (branch \`${GITHUB_REF_NAME}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Cloudflare Pages deploy (hook)
        id: hook-deploy
        if: steps.wrangler-deploy.outputs.wrangler_skipped == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "hook_skipped=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::Sin hook ni token de Cloudflare. El push debería triggerear rebuild vía GitHub App de Pages."
              exit 0
            fi
            echo "::error::Para workflow_dispatch/schedule hace falta CLOUDFLARE_API_TOKEN o CLOUDFLARE_DEPLOY_HOOK_URL."
            exit 1
          fi
          echo "hook_skipped=false" >> "$GITHUB_OUTPUT"
          response=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL")
          if [ "$response" = "200" ] || [ "$response" = "201" ]; then
            echo "✅ Hook OK (HTTP $response). Cloudflare Pages empezará el build en ~30s."
            echo "- Deployment en cola vía Deploy Hook" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Hook devolvió HTTP $response. Revisa que la URL del hook sea válida."
            exit 1
          fi
