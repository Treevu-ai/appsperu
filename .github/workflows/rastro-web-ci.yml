name: Rastro Web CI

on:
  pull_request:
    paths:
      - "apps/rastro-web/**"
      - ".github/workflows/rastro-web-ci.yml"
      - ".github/workflows/rastro-web-deploy.yml"
  push:
    branches: [master]
    paths:
      - "apps/rastro-web/**"
      - ".github/workflows/rastro-web-ci.yml"
      - ".github/workflows/rastro-web-deploy.yml"

permissions:
  contents: read

concurrency:
  group: rastro-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint-meta + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rastro-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/rastro-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint meta
        run: npm run lint:meta

      - name: Unit tests
        run: npm test
        env:
          # Tests usan MSW, no necesitan URLs reales. Pero Vite config exige las
          # 14 vars; proveemos placeholders que vite.config.ts ignora en mode=test.
          VITE_API_BASE_URL_RADAR_EJECUCION: http://localhost:4000
          VITE_API_BASE_URL_COMPRAS_PUBLICAS: http://localhost:4001
          VITE_API_BASE_URL_RADAR_INVERSIONES: http://localhost:4002
          VITE_API_BASE_URL_INFOBRAS: http://localhost:4003
          VITE_API_BASE_URL_CEPLAN_ESTRATEGICO: http://localhost:4004
          VITE_API_BASE_URL_CEPLAN_GEO: http://localhost:4005
          VITE_API_BASE_URL_IDENTIDAD_FISCAL: http://localhost:4006
          VITE_API_BASE_URL_SALUD_INSTITUCIONAL: http://localhost:4007
          VITE_API_BASE_URL_PROVEEDORES_SANCIONADOS: http://localhost:4008
          VITE_API_BASE_URL_ACTIVIDAD_AGRARIA: http://localhost:4009
          VITE_API_BASE_URL_SEGURIDAD_CIUDADANA: http://localhost:4010
          VITE_API_BASE_URL_BCRP_COMERCIO_EXTERIOR: http://localhost:4011
          VITE_API_BASE_URL_INVERSION_PRIVADA: http://localhost:4012
          VITE_API_BASE_URL_BCRP_LA_LIBERTAD: http://localhost:4013

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL_RADAR_EJECUCION: http://localhost:4000
          VITE_API_BASE_URL_COMPRAS_PUBLICAS: http://localhost:4001
          VITE_API_BASE_URL_RADAR_INVERSIONES: http://localhost:4002
          VITE_API_BASE_URL_INFOBRAS: http://localhost:4003
          VITE_API_BASE_URL_CEPLAN_ESTRATEGICO: http://localhost:4004
          VITE_API_BASE_URL_CEPLAN_GEO: http://localhost:4005
          VITE_API_BASE_URL_IDENTIDAD_FISCAL: http://localhost:4006
          VITE_API_BASE_URL_SALUD_INSTITUCIONAL: http://localhost:4007
          VITE_API_BASE_URL_PROVEEDORES_SANCIONADOS: http://localhost:4008
          VITE_API_BASE_URL_ACTIVIDAD_AGRARIA: http://localhost:4009
          VITE_API_BASE_URL_SEGURIDAD_CIUDADANA: http://localhost:4010
          VITE_API_BASE_URL_BCRP_COMERCIO_EXTERIOR: http://localhost:4011
          VITE_API_BASE_URL_INVERSION_PRIVADA: http://localhost:4012
          VITE_API_BASE_URL_BCRP_LA_LIBERTAD: http://localhost:4013

  e2e:
    name: e2e (Playwright — JSON de API = JSON renderizado)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rastro-web
    env:
      # webServer de playwright.config.ts corre `npm run build && npm run
      # preview`; el build necesita las 14 vars igual que el job de arriba.
      # Los valores no importan: e2e/*.spec.ts intercepta cada fetch con
      # page.route, nunca llega a resolver estos hosts.
      VITE_API_BASE_URL_RADAR_EJECUCION: https://radar-ejecucion.example.test
      VITE_API_BASE_URL_COMPRAS_PUBLICAS: https://compras-publicas.example.test
      VITE_API_BASE_URL_RADAR_INVERSIONES: https://radar-inversiones.example.test
      VITE_API_BASE_URL_INFOBRAS: https://infobras.example.test
      VITE_API_BASE_URL_CEPLAN_ESTRATEGICO: https://ceplan-estrategico.example.test
      VITE_API_BASE_URL_CEPLAN_GEO: https://ceplan-geo.example.test
      VITE_API_BASE_URL_IDENTIDAD_FISCAL: https://identidad-fiscal.example.test
      VITE_API_BASE_URL_SALUD_INSTITUCIONAL: https://salud-institucional.example.test
      VITE_API_BASE_URL_PROVEEDORES_SANCIONADOS: https://proveedores-sancionados.example.test
      VITE_API_BASE_URL_ACTIVIDAD_AGRARIA: https://actividad-agraria.example.test
      VITE_API_BASE_URL_SEGURIDAD_CIUDADANA: https://seguridad-ciudadana.example.test
      VITE_API_BASE_URL_BCRP_COMERCIO_EXTERIOR: https://bcrp-comercio-exterior.example.test
      VITE_API_BASE_URL_INVERSION_PRIVADA: https://inversion-privada.example.test
      VITE_API_BASE_URL_BCRP_LA_LIBERTAD: https://bcrp-la-libertad.example.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/rastro-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium only)
        run: npm run e2e:install

      - name: Run E2E suite
        run: npm run e2e

      - name: Summarize E2E result
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const path = 'e2e-results.json';
          if (!fs.existsSync(path)) { console.log('Sin reporte JSON de Playwright.'); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          let passed = 0, total = 0;
          for (const suite of report.suites ?? []) {
            for (const spec of suite.specs ?? []) {
              total += 1;
              if (spec.ok) passed += 1;
            }
          }
          const line = \`E2E verde, \${passed}/\${total} diffs OK (JSON de API = JSON renderizado)\`;
          console.log(line);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## ' + line + '\n');
          "

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/rastro-web/playwright-report/
          retention-days: 7
