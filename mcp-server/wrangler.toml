# MCP Worker de Rastro — Cloudflare Workers.
#
# La capa de datos NO es D1 sino Neon (Postgres 17 serverless). Razón en
# docs/adr/0024-neon-en-lugar-de-d1.md: D1 no tiene PostGIS ni transacciones
# ni advisory locks, y el repo los usa en 2, 38 y 8 apps respectivamente.
#
# Hay un solo secret, no uno por app. Las 36 bases viven en el mismo proyecto
# Neon, así que comparten host, rol y compute; lo único que cambia es el
# nombre de la base, y ese se deriva del AppKey en src/db/neon-env.ts.
#   npx wrangler secret put NEON_DATABASE_URL
#   →  postgresql://USER:PASS@ep-xxx.<region>.aws.neon.tech/postgres
# El resolver reescribe el path por app y por la base `mcp` (auth y budgets).
#
# nodejs_compat es obligatorio: @neondatabase/serverless y node:crypto
# dependen de APIs de Node que el runtime no expone sin ese flag.
name = "rastro-mcp-worker"
main = "src/worker.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Neo no expone consultas desde un binding: el secret se carga en runtime.
# El catálogo de 209 tools se genera en build desde catalog.ts, así que no
# necesita ir en vars.

[triggers]
crons = []
