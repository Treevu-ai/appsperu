# MCP Worker de Rastro — Cloudflare Workers.
#
# La capa de datos NO es D1 sino Neon (Postgres 17 serverless). Razón en
# docs/adr/0024-neon-en-lugar-de-d1.md: D1 no tiene PostGIS ni transacciones
# ni advisory locks, y el repo los usa en 2, 38 y 8 apps respectivamente.
#
# Hay un solo secret, no uno por app. Las 36 bases viven en el mismo proyecto
# Neon, así que comparten host, rol y compute; lo único que cambia es el
# nombre de la base, y ese se deriva del AppKey en src/db/neon-env.ts.
#   npx wrangler secret put NEON_DATABASE_URL
#   →  postgresql://USER:PASS@ep-xxx.<region>.aws.neon.tech/postgres
# El resolver reescribe el path por app y por la base `mcp` (auth y budgets).
#
# nodejs_compat es obligatorio: @neondatabase/serverless y node:crypto
# dependen de APIs de Node que el runtime no expone sin ese flag.
name = "rastro-mcp-worker"
main = "src/worker.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

# Ruta pública DESACTIVADA por ahora (2026-09-29): el security-reviewer marcó
# CRITICAL que el Worker acepta tráfico sin x-api-key ("modo abierto", ver
# worker.ts línea ~83) — con esta route activa cualquiera en internet podía
# pegarle a los 209 tools sin límite. Publicado unas horas y revertido de
# inmediato al confirmar el hallazgo. Antes de reactivar: decidir si el modo
# abierto es aceptable (datos públicos, sin rate limit) o si hay que exigir
# x-api-key en el path HTTP. Ver docs/ENDPOINTS.md y RUNBOOK_NEON.md.
# routes = [
#   { pattern = "rastro.fyi/mcp*", zone_name = "rastro.fyi" },
#   { pattern = "www.rastro.fyi/mcp*", zone_name = "rastro.fyi" }
# ]
#
# `routes = []` explícito (no solo comentado) — wrangler solo borra rutas ya
# asignadas en la zona cuando diffea contra una clave `routes` presente;
# omitirla por completo dejó las 2 rutas anteriores activas en el edge pese a
# que el deploy dijo "No targets deployed" (verificado: la respuesta seguía
# viniendo del Worker, no de Pages).
routes = []

# Sin `routes`, Cloudflare activa por defecto un subdominio workers.dev
# público — igual de alcanzable desde internet que la route de arriba.
# Se desactiva explícitamente mientras el modo abierto siga sin resolver.
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Neo no expone consultas desde un binding: el secret se carga en runtime.
# El catálogo de 209 tools se genera en build desde catalog.ts, así que no
# necesita ir en vars.

[triggers]
crons = []
