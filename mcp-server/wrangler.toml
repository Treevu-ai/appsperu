# geo-intersections uses PostGIS in Postgres — D1 does not support PostGIS.
# This binding points to a D1 DB, but geo-intersections handlers will need
# spatial functions reimplemented or a Neon fallback.
[[d1_databases]]
binding = "DB_GEO_INTERSECTIONS"
database_name = "rastro_geo_intersections"

[triggers]
crons = []

