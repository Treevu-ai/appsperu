name = "rastro-mcp-worker"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
ENV = "production"

# D1 database for MCP server's own tables (API keys, usage logs)
# Create with: npx wrangler d1 create rastro_mcp --local
# Then add database_id (UUID) for remote deployment.
[[d1_databases]]
binding = "MCP_DB"
database_name = "rastro_mcp"
migrations_dir = "src/db/migrations"

# 38 app databases — cada app tiene su propia DB D1
[[d1_databases]]
binding = "DB_RADAR_EJECUCION"
database_name = "rastro_radar_ejecucion"

[[d1_databases]]
binding = "DB_COMPRAS_PUBLICAS"
database_name = "rastro_compras_publicas"

[[d1_databases]]
binding = "DB_RADAR_INVERSIONES"
database_name = "rastro_radar_inversiones"

[[d1_databases]]
binding = "DB_INFOBRAS"
database_name = "rastro_infobras"

[[d1_databases]]
binding = "DB_CEPLAN_ESTRATEGICO"
database_name = "rastro_ceplan_estrategico"

[[d1_databases]]
binding = "DB_CEPLAN_GEO"
database_name = "rastro_ceplan_geo"

[[d1_databases]]
binding = "DB_IDENTIDAD_FISCAL"
database_name = "rastro_identidad_fiscal"

